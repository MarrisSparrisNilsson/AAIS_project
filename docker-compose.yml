version: '3.8'

services:
  invoice-api:
    build:
      context: .
      dockerfile: Dockerfile.model
    container_name: invoice-extraction-api
    ports:
      - "8000:8000"
    volumes:
      # Mount mlruns directory (so model updates don't require rebuild)
      - ./mlruns:/app/mlruns
      # Mount mlflow.db (so MLflow data persists)
      - ./mlflow.db:/app/mlflow.db
      # Mount invoices dataset (for testing purposes)
      - ./invoices_dataset:/app/invoices_dataset
    environment:
      - MLFLOW_TRACKING_URI=sqlite:///mlflow.db
      - PYTHONUNBUFFERED=1
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    gpus: all
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gradio-ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile.gradio
    container_name: gradio-invoice-ui
    ports:
      - "7860:7860"
    volumes:
      - ./invoices_dataset:/app/invoices_dataset
    environment:
      - BACKEND_URL=http://invoice-api:8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - invoice-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/"]
      interval: 30s
      timeout: 10s
      retries: 3

